# Publishes site/ (Home, About, Contact) to GitHub Pages at the domain in site.config.json.
# Started by hand only (Actions tab > "Publish website" > Run workflow): pushing never deploys.
# It also stops unless site.config.json has "deploy": { "live": true }, which stays false until Ken says go.
# The cart in _drafts/ is never published by this workflow: only site/ is uploaded.
name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stop unless the site is marked live
        run: node -e "const c=require('./site.config.json'); if(!c.deploy.live){console.error('deploy.live is false in site.config.json: not publishing.'); process.exit(1)}"
      - name: Test the order maths
        run: node tools/pricing.test.js
      - name: Build
        run: node tools/build.js
      - name: Check the cart is not in the website
        run: test ! -e site/cart.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
